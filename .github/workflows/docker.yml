name: Build and publish container image

# The version Umbrel offers moves only after its image is in the registry.
#
# Umbrel offers an update the moment a higher `version` lands on main, and
# docker-compose.yml names that version's image. When pull requests raised
# that version themselves, the update was offered minutes before the image
# finished building, and an update taken in the gap failed with "manifest
# unknown". Publishing from the pull request narrowed the gap but could not
# close it: a pull request merged within seconds still raced its own build.
#
# So a pull request raises only package.json (what the image is built as),
# and this workflow, once main's image is pushed, commits the matching
# `version` in umbrel-app.yml and image tag in docker-compose.yml to main.
# That commit is made with GITHUB_TOKEN, so it starts no workflow of its own.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # A fork's pull request cannot push to this registry.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A normal build is under ten minutes. One that hangs should fail where
    # it can be seen rather than hold the release back for hours.
    timeout-minutes: 40
    permissions:
      # write: to commit the version bump that offers the update.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version, as a tag of its own: docker-compose.yml names it, so an
      # update pulls exactly this build and never a stale :latest. Pull
      # requests build without publishing, to catch a broken Dockerfile.
      - id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/blofstedt/autora
          # :latest only ever from main.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Umbrel Home is amd64; Raspberry Pi is arm64.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # The cache only saves time: a failure to write it ("failed to
          # reserve cache") must not fail a build that otherwise succeeded.
          cache-to: type=gha,mode=max,ignore-error=true

      # Only now, with the image in the registry, does Umbrel get to see it.
      - name: Offer this version on Umbrel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 .github/scripts/offer_release.py "${{ steps.version.outputs.version }}"
