name: Check

# The same three things CLAUDE.md asks for before a push, so a change that
# skips them is caught here rather than by the image build.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (typecheck and ESLint)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
