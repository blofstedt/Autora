gallery: []
releaseNotes: >-
  The plain page can now tell you whether the secure page is actually
  running.


  A secure page that will not load looks identical from a phone whether
  the listener has died, the port is blocked on the network, or the
  certificate is being refused -- and those need completely different
  fixes. The server can distinguish the first from the others, because it
  can try the port from the inside, so it does. Open Settings on the
  plain address and the Microphone check panel now says whether anything
  is answering on the secure port.


  No change to the secure page itself, which is tested and working. This
  is about being able to tell which half of it is broken when it is not.
