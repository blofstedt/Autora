releaseNotes: >-
  A CAPTCHA that draws itself was being reported blank on this machine, and
  the reason was not the page: the browser had no WebGL. getContext("webgl")
  returned null, the page's own script gave up, and the canvas stayed empty
  for ever -- not a picture that has not been drawn yet, a picture that never
  will be. Verified here: with no flags WebGL is false; with --use-angle=vulkan
  --ignore-gpu-blocklist it is true, on Mesa's software Vulkan (llvmpipe,
  drawing on the CPU, no graphics card needed). Both flags are now used, but
  only when a Vulkan driver is actually installed -- asking for a backend that
  is not there would take WebGL away from a browser that had it. The image
  installs that driver (vulkan-loader, mesa-vulkan-swrast) itself now.

  A blank picture also says which blank it is: "this browser has no WebGL, and
  a CAPTCHA the page draws with it never appears at all" rather than "the page
  has not been given a moment", which sent you looking at the wrong thing.

  And the words are read: the distorted-text challenge of neal.fun/not-a-robot
  Level 3, fetched as a plain .webp, is read by the connected model as six
  characters -- the three pictures served by that level came back WVUGYQ,
  YHRPCD and FNZZSD -- where before the model was asked with a thinking
  budget and answered with nothing at all.
