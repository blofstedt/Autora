releaseNotes: >-
  Dictation no longer repeats itself. On Android, speaking "this is a test"
  could fill the box with "this this is this is a this is a test", because the
  phone reports every step of a sentence as a new, finished phrase; each word
  now goes in once. The memory graph is now a square everywhere, so it has the
  same shape on a phone and a desktop. On a desktop it sits at the bottom of a
  slightly wider left menu instead of in its own column on the right, which
  gives the conversation more room. On a phone it still folds to one line and
  opens as a square.
