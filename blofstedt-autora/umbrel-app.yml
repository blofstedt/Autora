releaseNotes: >-
  Records about the same thing are connected now. Links were only ever
  written when the agent asked for one, so related memories sat side by
  side unconnected and the knowledge web was a scatter of dots; they are
  inferred on write, and inferred once for memories written before this.
  Also drops the record counter from the knowledge view.
