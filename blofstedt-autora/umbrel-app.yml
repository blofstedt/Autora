releaseNotes: >-
  Autora can speak in your own voice. If you have a speech server running
  beside it — Kokoro, or anything else that speaks the OpenAI audio API —
  Settings → Themes & voice now lists the voices that server offers, and
  every reply read aloud uses the one you pick, on every device. Autora finds
  the server by name on the Umbrel network and falls back to the browser's
  own voice when there is none, saying so in the panel rather than going
  quiet. Point it elsewhere with AUTORA_KOKORO_URL, and choose the voice it
  starts with using AUTORA_KOKORO_VOICE.


