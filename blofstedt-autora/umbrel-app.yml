releaseNotes: >-
  A message can carry a file now. Beside Talk in the chat box there is a
  paperclip: choose a document and it goes to the Artifacts store straight
  away, waiting as a small chip above the box until you send -- remove one
  with its x if you change your mind. To the right of it, a camera button
  opens the camera on the phone or laptop you are using and attaches the
  photograph the moment you press the shutter. Files travel with your words
  rather than instead of them, and a message made of nothing but a file is a
  whole request. Whatever a turn came with is listed under it afterwards, so
  you can see later what you handed over, and the agent is told what it has
  been given: a picture is shown to it as a picture, once, on the turn it
  arrived and not again on every turn after, and a document is there for it to
  read whenever it needs it. The camera needs a secure page -- so it appears
  on the optional https address -- while the paperclip works either way.

