releaseNotes: >-
  A friendlier first run and a tidier app. A new install now opens on a card
  that connects a model (pick a provider, paste a key, done) instead of a chat
  that could not answer, and once a model is connected the empty chat offers
  example tasks to start from. The sidebar is regrouped with plainer names:
  Schedules (was Cron), Integrations (was MCP), Usage (was Analytics) and
  Settings (was Config), where themes and fonts now live under Appearance.
  Settings save themselves as you change them, connected providers are listed
  first, and keys have their own Save button. Deleting a session can be undone
  for a few seconds. The header shows what the session has cost rather than
  token counts, the Dictate and Talk buttons are labelled and sit in the
  message box on phones too, and long help text is folded away.


