releaseNotes: >-
  The browser Autora drives now looks like the one you use. It reports the
  real installed Chrome version and a desktop platform instead of a bare
  number, takes its timezone and locale from the machine’s own public IP so
  they agree with the address a site sees, and carries the fonts a desktop
  carries. Functions the stealth layer patches say they are native code, the
  WebGL vendor and renderer read as a real graphics card, and the chrome.*
  surface a desktop browser has is there. A Cloudflare holding screen is
  recognised for what it is and reported in the turn note rather than
  described as a page that failed to load. Stop is now a badge on the corner
  of Send, in the one place you already press, and still there when Send is
  greyed out — which is exactly when a turn is running with an empty box.
