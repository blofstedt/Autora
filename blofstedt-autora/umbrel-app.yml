releaseNotes: >-
  New: Jev Mode, fast scored decisions. Where a decision has a fixed set of
  answers, every option's probability is read in one parallel pass instead
  of the answer being written out, and it is accepted only if each part
  clears a confidence threshold (0.75 by default, adjustable in Settings).
  Anything less certain goes to the normal path, exactly as before.


  Its first job is memory recall: with a model that returns token
  probabilities -- a local server (vLLM, llama.cpp, Ollama), GPT-4o/4.1,
  DeepSeek, some Gemini models -- each memory is now judged relevant or not
  to your request, with a confidence you can see in the thread, instead of
  by keyword. Anthropic models and reasoning models (GPT-5, o-series) do not
  return probabilities, so on those nothing changes. Jev can be switched off
  in Settings.


  Also in this release: a one-surface desktop layout, a redesigned message
  box, the live browser used directly in the chat, question cards, formatted
  replies, and a memory graph that folds to one line.

