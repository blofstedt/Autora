releaseNotes: >-
  The model that reads a CAPTCHA picture was being asked to answer in 300
  tokens while a reasoning model thinks first -- so on a picture it spent the
  whole allowance thinking and answered with nothing at all, every time, and
  the solver reported "nothing usable came back" on a widget it could have
  read. It is told not to think now, and the picture path answers.

  Two more things a picture challenge needed. "Select all the squares with a
  stop sign" is a question about where the red is, and that is arithmetic on
  this machine, with no key, no network and no model: the squares are scored
  by how much of them is the colour the prompt names, and the ones that stand
  out are clicked. It also stops declaring a pass the moment the squares
  vanish for a frame -- a challenge that comes back is not passed, and the
  next backend gets its turn.

  There is a third kind of challenge now: the text CAPTCHA, the distorted
  letters in a picture with a box under them and a button. It is found, the
  letters are read by the connected model, and they are typed in and
  submitted. And a picture that comes back blank -- a canvas the page has not
  drawn, a tab that is not being rendered -- is reported as blank instead of
  being sent to a model to invent letters from.

  Checked live on neal.fun/not-a-robot: the box the game draws itself, then
  Level 2's 4x4 stop-sign grid solved on this machine with nothing paid and
  nothing sent anywhere, and the game moving on to Level 3.
