releaseNotes: >-
  Autora now tells you when the page you are looking at is older than the
  version installed.


  An update can arrive and leave no trace: the browser keeps a copy of the
  app, and a page opened while the container was restarting -- which is
  exactly what an update does -- keeps running the old copy. Everything
  works, nothing errors, and the only symptom is that the change you were
  told had shipped is not there.


  The page is now stamped with the version that served it and compares
  that with what the server reports. When they differ, a bar across the
  top says so and offers one button that clears the cache and loads the
  new one. Settings opens with the version as well, so "did my update
  arrive" is answerable in one look rather than from a line buried in the
  microphone check.


