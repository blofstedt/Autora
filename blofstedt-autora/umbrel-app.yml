releaseNotes: >-
  Autora works out what it can do for you, notices when something is wrong,
  and can reach your phone.

  A new chat now opens on tasks that fit your server instead of four fixed
  examples: find what is filling a disk that is nearly full, look at an app
  that keeps restarting, fix a schedule that failed, a brief on the stocks you
  have told it about, a summary of your email if its browser is signed in to
  Google, what needs you on GitHub. They are read from what is actually there
  -- no guessing, and no model call to make them -- and one tap starts them.
  "What could you do for me?" is always last: it looks around and suggests.

  After a reply, a few one-tap next steps: watch the page it just read for
  changes, do the same thing every morning, save a run of commands as a tool
  of its own, or the follow-up the look back after the turn thought of.

  It notices things by itself every few minutes: a disk over 90%, a Docker
  app restarting or unhealthy (read from Docker's socket, read-only), a
  schedule whose last run failed. Each is said once, sits in the sidebar and
  on a new chat with "look into it", and can be waved away until it clears.

  Once it knows enough it offers a schedule, once: a morning brief on your
  stocks, a morning email summary, a weekly check of your apps or disk. Every
  one only reports, and steps out of your quiet hours.

  Phone notifications, in Settings: ntfy (the app, or your own server -- it is
  in the Umbrel app store) or a Telegram bot of your own, with a button that
  finds your chat for you. It messages you when it needs an answer from you,
  when a schedule, watcher or trigger finishes, when it notices something, and
  when a long task finishes while nobody is looking. Quiet hours hold them and
  send one message when they end. Tokens are kept with your other secrets.

  Also: the empty chat scrolls instead of cutting off its top and bottom when
  there is a lot on it, and a chat started from a suggestion is named after it.
