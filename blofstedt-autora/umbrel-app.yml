releaseNotes: >-
  The microphone check in Settings now appears even when the browser has
  no speech recognition at all -- which was exactly the case it was most
  needed for, and exactly the case where it hid itself. "There is nothing
  in Settings" is a far worse answer than "this browser cannot do speech
  recognition", and it was giving the first one.


  If you are hunting a microphone that does nothing: Settings, Microphone
  check, Run check, then say a sentence. It prints every step the browser
  takes and stops where the fault is. Note that reading replies aloud and
  transcribing what you say are two unrelated browser features -- one
  working tells you nothing about the other.
