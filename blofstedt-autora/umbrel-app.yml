releaseNotes: >-
  Adds a microphone check, in Settings, for when dictation does nothing.


  Speech recognition fails silently: it starts, reports no error, and
  simply never returns a word, which from the outside looks exactly like
  the feature not being built. Several quite different causes produce that
  same nothing -- a permission the browser remembers as denied, a speech
  service the phone does not have, audio that never reaches the engine --
  and they need opposite fixes.


  So Settings now has Microphone check. Tap Run check, say a sentence, and
  it prints every step the browser's own speech engine takes: whether it
  started, whether audio reached it, whether it found speech in that
  audio, and what it transcribed or what error it gave. Where the list
  stops is the answer.
