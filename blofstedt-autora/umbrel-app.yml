releaseNotes: >-
  Settings now says what went wrong instead of "Could not read settings",
  and offers a Try again button. The old message covered every possible
  cause with the same four words and never retried -- so opening Settings
  while the app was still restarting after an update left it dead until
  you closed and reopened it, with nothing on screen to suggest that.


  If you saw that message: the app was unreachable at that moment. The
  page itself loads from an offline cache, so a server that is down does
  not announce itself -- the app appears, and only the parts needing the
  server fail quietly.


  That same cache could also pin a phone to an old copy of the app after
  an update, which made shipped fixes look like they had not shipped. This
  release clears it. If anything still looks stale, open Chrome's site
  settings for this address and clear its data once.


  The Microphone check panel now also appears when the browser has no
  speech recognition at all, which is the case it was most needed for.
