releaseNotes: >-
  The Mind's map frames itself. Open the Map and the whole graph is on screen
  from the first moment, names included -- a fit that took the dots and left
  the labels off the edge was not fitting anything -- and it keeps itself in
  frame while the layout is still spreading out, rather than settling outside
  the window and jumping into it afterwards. The moment you pan or zoom, the
  frame is yours and the layout leaves it alone; Fit brings it back, and two
  fingers on the map now zoom it as well as the wheel does.

  Tapping the cost bar opens the figures over the chat instead of taking the
  conversation off the screen to do it: the month against the ceiling you set,
  today, all time and this session, with Usage -- ceiling and all -- one
  button further on.

  Back leaves Autora for the Umbrel dashboard, not out of the app. Installed
  to a phone, back is a system gesture, and with nothing behind the app it
  closed Autora and left you nowhere. The app now answers the first back
  itself: whatever is open over the chat closes, and the back after that
  steps out to the dashboard -- which is the same address with Autora's port
  taken off, so it is the dashboard that opens rather than a second copy of
  the app.

  And tapping outside a card closes it again. The click was read as a second
  tap on the bar that opened the card, which closed it and reopened it in the
  same gesture, so the backdrop looked dead.
