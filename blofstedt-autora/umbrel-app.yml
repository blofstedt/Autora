releaseNotes: >-
  Dictation and live chat actually transcribe now. The ring that pulses
  while you speak was opening its own microphone to measure your voice,
  and on Android that quietly starves the speech engine: it starts,
  reports no error, and never returns a word. So the interface said
  "listening" with complete confidence while nothing was being heard,
  which is indistinguishable from the feature not existing. The ring
  follows the words now instead of the microphone, and there is only one
  thing holding the mic.


  Live chat also sends when you stop talking rather than waiting for the
  engine to declare your sentence finished -- on Android it often never
  does, so a pause now sends what it heard.


  And DeepSeek can get through a conversation with tools in it. Once a
  chat has made a single tool call, DeepSeek wants the model's reasoning
  attached to every assistant message after it, not just the one that
  called the tool. Sending it on only that one failed with exactly the
  same error as sending none, which is why the previous fix looked like it
  had worked.
