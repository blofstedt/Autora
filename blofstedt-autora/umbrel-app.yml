releaseNotes: >-
  New: the PDF window. When Autora works on a PDF, it opens in the SecurePDF
  editor beside the chat (a tab at the top on a phone, with full screen). What
  it places, like a signature, text, a stamp or a note, appears as you watch,
  and you can move, resize, edit or remove it, or add your own. The file is
  saved as you go, and Autora is told what you changed.

  The to-do list now sits on top of the message box instead of at the top of
  the screen. It shows the task the agent is on, and slides to the next one as
  each is done. Tap it to see every task.

  Fixed: "Set it up" on the Integrations page works. It used to fail with a
  message meant for the agent ("Say in one line why...").

  Artifacts: the Select bar is gone. Press and hold a file to start selecting.

  Tidier pages: every page now lines up under its title. On Notebooks and
  Integrations the add button is in the top-right corner, as on Schedules.
  Triggers and Schedules explain themselves in the empty page instead of a
  block of text at the top. Settings, System and Mind tabs span the width on a
  phone, and the message box keeps its buttons on one row.

  Removed the "Do this every morning" and "Save this as a tool" suggestions
  under replies.
