releaseNotes: >-
  Talk mode answers with two models, and one voice. A spoken turn goes to the
  fast model first, which replies without stopping to think, so the first word
  comes back in about the time it takes to say it. The moment a question turns
  out to need more than a sentence -- a file to read, a command to run, a fact
  to check -- it hands the work to the model above it, which thinks and takes
  as many steps as it needs. The fast model stays the mouth throughout: it says
  what it is doing while the other one works, and puts the answer into its own
  words when the work comes back. What the reasoning model writes is never
  shown to you raw; it is what the voice is reading.

  Name the fast model on the provider card in Settings -> Model & tools, under
  Talk mode. Left empty, talk mode answers with the model above, exactly as it
  did before.

  The look follows the behaviour. The star you hold to talk to is three times
  its size and no longer sits inside a ring, stretching and glowing while you
  speak and while the agent answers. The live bar is the full width of the
  window and as tall as the camera panel it shows, so a face in the camera and
  the thing you are talking to are the same size.
