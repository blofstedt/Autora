releaseNotes: >-
  The app now updates itself instead of serving you an old copy.


  If you reach Autora at two addresses -- say the plain one and the
  secure one on 8818 -- your browser treats them as two unrelated sites,
  each with its own offline cache. Updating the app updated one of them.
  The other kept serving whatever it had cached, looking completely
  normal while running old code, which made shipped fixes look like they
  had never shipped. Every page now asks for a fresh copy on load and
  reloads itself once when one arrives.


  Settings also shows which version is actually answering, at the bottom
  of the Microphone check panel. If it disagrees with what you just
  installed, that page is a cached copy and you can stop wondering.


  To get onto this one, since it is the version that fixes being stuck on
  old versions: open the address that did not update and pull down to
  reload. If it still shows an old version, clear that site's data once in
  Chrome's site settings.
