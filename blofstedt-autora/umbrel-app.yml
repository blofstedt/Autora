releaseNotes: >-
  Jev Mode is gone. It only worked with some models, added a wait before
  every turn, and never showed it helped. The check that matters, holding a
  risky command when it looks destructive and you did not ask for it, now
  asks the model you already use, once, only for those commands, and works
  with every provider. Commands nothing can undo still always stop and ask.

  Notifications now come from the app itself, and only from it: the
  installed app is the phone interface, so ntfy and Telegram are gone. In
  Settings, "Notify this device" makes Autora send to your phone or computer
  directly, with the app closed and nothing else to install: when it needs you, when a schedule runs, when it
  notices something. What is sent is encrypted so only your device can read
  it. It needs the https address (your Tailscale one).

  CAPTCHAs are far more reliable. The picture challenges were being looked for
  in a way that never found them, so a puzzle could be reported as passed
  without being touched; that is fixed. A model that answered the "can you see
  pictures" check correctly was being judged blind and never used; a single
  dropped connection could turn picture solving off until a restart; and a
  wrong answer was followed by an answer to the old question. Grids that
  replace squares as you click are now gone through round by round, "nothing
  matches" can be answered, and a model that never replies no longer holds up
  the turn.

  Plan and Ask modes no longer put up an approval card just to let Autora ask
  you a question or write its plan. Taking back a standing agreement is treated
  as the change it is.

  Your standing instructions in Settings now win over Autora's own style
  rules. Before, its built-in "plain prose" and "give your final answer in
  full" could outweigh a request for bullet points or brevity. Now those
  defaults give way to your instructions by name, and short instructions are
  repeated on every turn so they are in front of the model while it writes.

  Autora is better at getting around websites. It now notices when a cookie
  bar, pop-up or sticky header is drawn over what it wants to click, and says
  what is in the way and how to close it instead of clicking the wrong thing.
  It waits for pages that draw themselves with script, and for results that
  arrive a moment after a click, before deciding what is on the page, and it
  tells itself when a click changed nothing so it tries something else rather
  than the same thing again.

  On a phone, the page Autora is working, its plan and any explainer it draws
  now stay pinned above the conversation instead of scrolling away as it
  talks. Tabs switch between them when more than one is showing, and a
  handle folds them out of the way. Tap Follow and the view switches by
  itself to whatever Autora is working on; tap a tab to take over again. The
  words stay in the thread.

  What Autora is about to do on the page ("tap Book now") now shows under the
  picture on a phone, instead of over it where it hid the page.

  New: the app window. When Autora builds a website or an app it opens it
  beside the conversation (on a phone, as an App tab in the pinned view), live,
  at a phone, tablet or desktop size, and you watch it take shape: a dev server
  it starts, or a folder of files that reloads by itself as they change. Tap
  Select and point at anything: hover outlines an element, a tap picks it, the
  arrow keys step to what is around or inside it, shift adds more. Or drag a
  Region round anything. Say what should change, or try it right on the page:
  retype the words, change a colour, a size, a corner, the spacing. Every
  comment is kept with a picture and pinned where you made it, and they go
  together as one review, so one turn answers them all. Autora can look at its
  own work too, with the page's console errors.

  The kanban board is gone. Autora now keeps a plain to-do list, like the one
  in VS Code's Copilot: a checklist it writes before it starts, then ticks off
  as it works: the item it is on has a marching dashed box, and when it
  finishes the box fills green, a tick draws itself in and the title is
  struck through. You watch it; only Autora changes it. On a phone it is the
  "To do" tab in the pinned view above the conversation. Chats recorded with
  the old board show it as a list.

  A new selector in the message box sets how Autora works: Agent (the
  default) plans first and then builds, switching between the two by itself,
  and skips the plan only for a very simple task; each switch shows in the
  conversation. Build does the work straight away, as before, and Plan only
  looks and writes a plan and changes nothing. On a phone the
  selector is a small pill that opens a list, and both pop-ups now open
  centred on a phone instead of off to one side.

  The pill in the header is now about permissions only: Yolo, or Ask. Ask
  holds anything that changes something for your yes, or only what you name:
  write when it should ask ("before deleting anything, before sending a
  message") or tap the suggestions. Plan mode no longer puts up approval
  cards; it simply refuses changes. Chats that were set to Ask keep asking, as Build.

  Two small fixes: a tool call with a list in it (the to-do list, a form) no
  longer shows as "[object Object]" in the thread, and an integration
  suggestion no longer says its description twice.

  While Autora is working, the send button becomes a clear red Stop button
  when the box is empty, so you can always halt a run.

  Pictures and files you attach now reach the model on every turn, not only
  the first: they were being dropped when the conversation was rebuilt.

  Scripts Autora saves as its own tools are more forgiving about parameters
  and warn when a script uses one it never declared, instead of failing
  quietly.

  Settings has a time zone. Your device's zone is adopted automatically, and
  schedules and quiet hours follow it; an unknown zone is refused rather than
  silently treated as UTC.
