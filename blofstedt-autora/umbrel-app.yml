releaseNotes: >-
  Clearer about the one thing standing between you and the microphone.
  Dictation and live voice chat are built and working; browsers simply
  refuse to open a microphone on a page that is not secure, and an address
  on your own network is not secure as far as a browser is concerned. No
  setting in the browser can change that, so the app used to say so and
  stop there.


  It now tells you what actually fixes it. If your server is on a tailnet,
  running `tailscale serve --bg 8817` on that machine — one line, once —
  gives this app a proper web address with a real certificate. Open that
  address instead and the microphone and Live buttons simply work, with no
  warnings, no port number, and your Umbrel login still in front of
  everything. Any other reverse proxy with a certificate does the same.


  If you have nothing in front of your server, AUTORA_TLS=1 in
  ~/umbrel/app-data/blofstedt-autora/data/autora.env makes the app serve
  its own secure page on port 8818. That works too, but each device shows
  a certificate warning once, and port 8818 does not ask for your Umbrel
  login — so it stays off unless you choose it.
