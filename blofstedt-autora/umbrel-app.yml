releaseNotes: >-
  Autora can now grow its own integrations. When a task lives on a service with
  an API (GitHub, Slack, Notion, a database, maps, library docs) it offers to
  set up an MCP server instead of working through the website: a card says
  why it is better for what you asked and exactly what will run, and nothing
  is installed until you tap Set it up. Not now is remembered for the rest of
  the conversation. Keys a server needs are typed on the card and go straight
  into Secrets, never into the chat or to the model. Beyond its built-in list
  it can offer any MCP server on npm, a remote one, or write a small server of
  its own for a service that has none. Servers it set up are marked on the
  Integrations page, and you can ask it what MCP servers could help with a
  task.


