gallery: []
releaseNotes: >-
  The home screen and browser tab icons are the Autora spark now, not the
  ring-and-dot from an older version of the mark. Nothing in the running
  app had drawn that shape in a long time, so the one place the icon is
  seen at full size was the one place it was wrong.


  The tab icon still tells you what the agent is doing while you are
  looking elsewhere, it just does it by colouring the tile behind the
  spark rather than by replacing the middle of it: violet while it works,
  green on a live voice session, amber when it is waiting for you to
  approve something.


  Note that "Add to home screen" will only offer a plain shortcut, not a
  real installed app, unless the page has a certificate your phone
  trusts. That is the browser's rule and no setting changes it. A
  self-signed certificate -- what AUTORA_TLS=1 generates -- is enough for
  the microphone but not for installing. A proxy with a real certificate
  in front of port 8817 gets you both.
