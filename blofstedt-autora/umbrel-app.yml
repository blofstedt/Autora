releaseNotes: >-
  Reasoning stays folded. Every reply used to arrive behind the thinking
  that produced it, which on a phone pushed the answer off the screen as
  it was being written. Turns start collapsed now, the live one included —
  tap to open it.


  Sessions have names. The app was passing its own name as the title of
  every session it opened, so the switcher was a column of identical rows,
  and that title also outranked the name a session takes from its first
  message. It passes none now, and sessions already recorded under it
  recover a name from the first thing you asked them.


  DeepSeek can hold a conversation again. Its thinking mode refuses a turn
  whose reasoning has been stripped out, which was every turn here — so
  once a session had used a tool, every later message failed with a 400
  and the session could not continue. The reasoning is kept and sent back
  now, and an endpoint that wants the opposite is taken at its word.


  Voice is reachable from a phone. Browsers only open a microphone on a
  secure page, and no site setting makes an http address on your own
  network into one. Set AUTORA_TLS=1 in
  ~/umbrel/app-data/blofstedt-autora/data/autora.env and restart: port
  8817 keeps working exactly as before, and the app also serves https on
  8818. Open that, click through the certificate warning once per device,
  and dictation and Live appear. On http they are still in the composer,
  greyed, and say what is in the way. Note that 8818 is published
  directly, so it does not go through Umbrel's login — leave AUTORA_TLS
  unset if you would rather it stayed that way.


