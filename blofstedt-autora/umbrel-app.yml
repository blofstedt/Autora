releaseNotes: >-
  The camera is back on the live bar, in the corner beside the X. It was taken
  off and left in Settings only, which put the one thing you want mid-sentence
  -- show it what you are holding -- two taps away, in a panel you have to leave
  talk mode to reach. One picture, where the eye already goes for a control on
  that strip: lit when it is on, and the choice is remembered, so the next
  conversation opens the way this one ended. Settings -> live view carries the
  same switch, for setting it without coming into talk mode.

  The beep on a phone is gone. Talking to the app on Android played the
  microphone cue every few seconds, because the Web Speech API there is not a
  browser feature at all: it is a session handed to Google's speech service,
  which plays its own cue when the session opens and again when it closes. A
  recogniser cannot be kept open -- it ends after every silence and after most
  phrases -- so staying in talk mode meant starting the next one, and every
  re-arm was another cue. Nothing on the page could stop it; the sound is not
  ours to make or to mute.

  With a Deepgram key the microphone is now opened once, when talk mode starts,
  and one stream of raw PCM runs for as long as it lasts -- no session to end,
  no restart, no cue. The audio goes to this machine, which holds the key and
  passes it on; a page is never handed a credential. The name is given to the
  transcriber as a hint, so "Autora" comes back spelled the way it is written
  instead of the aurora/atora spelling the recogniser used to arrive with.

  Without a key nothing changes: the browser's own recogniser is still there,
  and is what the page chooses.

  The rest of 0.9.98 stands, unchanged: the voice can be switched off from the
  conversation and stays off, the chat-mode menu opens inside the window on a
  phone, and the dots in the chat list mean one thing -- green is a chat the
  agent is working in at this moment.
