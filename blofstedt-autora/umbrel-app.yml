releaseNotes: >-
  A CAPTCHA of distorted letters is read from the page itself now, not only
  from the widget's own image file. The crop that comes off the page is twenty
  pixels of glyphs under a speckle of coloured noise, and a model asked to read
  that answers with nothing at all -- while the same model, given the same
  letters drawn clean and large, reads every one of them. The model was never
  the problem; the picture it was being asked about was.

  So the picture is prepared before it is sent. Every pixel is repeated four
  times over, which makes a glyph four times the size without smoothing it or
  inventing anything; and the same crop is sent a second time with every pixel
  put to one question -- is this the ink's colour, or is it nearer to paper --
  and answered black or white, which takes the noise out and leaves the
  letters. Both go in the same call, so a model that cannot see the letters in
  the cleaning still has the drawing itself to work from.

  The cleaning is arithmetic, in captcha-images.ts: the ink is the busiest hue
  among the coloured pixels (under a sixth of them is speckle rather than
  letters, and the picture is then left alone), and the paper is the picture's
  own brightness. It also brings a PNG encoder, without which a picture the
  solver has worked on could not be handed over at all.
