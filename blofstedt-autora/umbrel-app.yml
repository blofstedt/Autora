releaseNotes: >-
  The agent is much better at using web pages. Each field now tells it what it
  is for (first name, last name, shipping ZIP...), what kind of value it takes,
  which section it is in, what it currently holds, and any error the page
  shows on it; dropdowns list their choices. One fill now handles dropdowns,
  checkboxes and dates as well as text, and reports back what each field
  ended up holding. Scrolling works by screens, straight to some text, or
  inside a panel, and says how far down the page is and when it has reached
  the end. The agent can press keys (Escape, Tab, arrows), sees fields inside
  web components and embedded frames, and clicks things that are only
  clickable by script. When a site refuses to let this browser sign in, the
  agent now recognises it and stops retrying; you can sign in on your own
  browser, export that site's cookies (for example with Cookie-Editor) and
  upload the file, and the agent imports the sign-in.

