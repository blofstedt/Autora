releaseNotes: >-
  Stop is /Stop. The small square badge that sat on the corner of Send is
  gone: the composer is the box, Send and the commands again, and typing
  /Stop in the box is how a turn is stopped.

  Sending a message while the agent is working no longer leaves a "Stopped."
  line above the answer. The turn that message interrupted is dropped without
  a word about it, and the next thing in the thread is the reply you asked
  for.

  And the condensing line says what happened. It compared the prompt as it
  stood when the fold was asked for against the prompt when it landed, with
  the turn working in between, so it could report the context growing --
  "about 6,000 tokens of context down to 7,500". Both figures are now taken
  either side of the swap itself, and when the record the summariser writes
  is longer than the turns it replaced, the line says so rather than claiming
  a drop that did not happen.

  Recall references no longer crowd the thread. A turn that used four memories
  used to write all four names into the conversation; now it says "recalled 4
  memories", and tapping that line unfolds the names. Tapping a name opens the
  memory itself -- what kind of thing it is, its name, and the text the agent
  kept -- over the chat, and closing it leaves the conversation where it was.
  The Mind page is a tap further on, from the bottom of that card.

