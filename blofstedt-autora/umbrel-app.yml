releaseNotes: >-
  Jev Mode now does two more jobs, on models that return token
  probabilities (local servers, GPT-4o/4.1, DeepSeek, some Gemini models).


  A tool guard. Commands that could destroy something -- rm, force pushes,
  hard resets, DROP TABLE, piping a download into a shell, and the like, plus
  any HTTP request that writes -- get a quick check first: is this
  destructive, and did you ask for it? If it is confidently both destructive
  and unasked-for, it does not run; the agent has to ask you with a question
  card. Say yes and the same command goes through; say no and it stays held.
  Everything the check is unsure about runs as before, and ordinary commands
  are never checked at all.


  Question routing. Each message is read as needing a direct answer, action
  with tools, or a clarifying question first, and the agent is told which
  before it starts. The tools stay available either way.


  Both run alongside memory recall, in parallel, and every decision shows in
  the thread with its confidence. Earlier in this series: Jev Mode itself,
  a one-surface desktop layout, a redesigned message box, the live browser
  used directly in the chat, question cards and formatted replies.

