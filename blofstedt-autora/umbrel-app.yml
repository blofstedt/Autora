releaseNotes: >-
  The message box no longer locks up at random. It used to be disabled
  whenever the connection to the server dropped for a moment, such as when a
  phone wakes up or the network blips. Now you can keep typing, and if a
  message can't be sent, what you typed is put back. Your standing
  instructions from Settings now come last in Autora's instructions on every
  turn, marked as yours and overriding its defaults, so rules like "be brief"
  are followed instead of buried.

