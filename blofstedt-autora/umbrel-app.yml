releaseNotes: >-
  Autora now connects to any of the major AI providers, and shows what they
  cost.


  Settings takes an API key for OpenAI, Google Gemini, Anthropic, DeepSeek or
  OpenRouter -- or points at a local OpenAI-compatible server -- and offers
  that vendor's models in a list, each quoted with its price per million
  tokens. Each provider keeps its own key, model and endpoint, so switching
  between them costs nothing. "Check key" asks the vendor whether the key
  works before you rely on it, and fills the model list from the same call;
  OpenRouter's catalogue and prices are fetched live.


  A billing card counts what you have spent: this month, today and all time,
  with a thirty-day chart and a breakdown by provider and model down to
  individual turns. It is counted here from the tokens each vendor reports, so
  it is a running estimate rather than an invoice, and it says so. An optional
  monthly budget warns as it fills, and does not block.


  Keys and the ledger are written to the app's data directory, so they survive
  an update rather than resetting with the container. Keys set in the
  environment still work and are never written there.


  Also fixes the container image, which had not built since the rewrite: it now
  builds the TypeScript server and the web UI, listens on the port Umbrel
  gives it, and stamps the page with its version again, so the "you are
  looking at an older copy" banner works.

