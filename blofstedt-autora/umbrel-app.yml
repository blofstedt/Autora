releaseNotes: >-
  New: Autora Photo, a photo editor beside the chat (PhotoCraft's, with layers,
  masks, adjustment layers, filters, type, brushes and real PSD files). Ask Autora
  to retouch, cut out, resize or colour a picture and it runs the editor's own
  commands while you watch; edit by hand at the same time and export PNG, JPEG,
  WebP, TIFF or PSD. It has its own switch on the Tools page. Also fixes the blank
  screen on load: a list the lazy pages register themselves in was created after
  the first page used it.

  Paired-down tools on a phone, and one look across them. The agent keeps every tool wherever
  the work is shown; the person gets a very simple app. PDF shows the page and one bar (Undo,
  Mark up, Fill & sign, Find): Mark up is Highlight, Text, Draw, Note and Eraser with a colour,
  Fill & sign is Fill Fields and Sign, and Find is one row. Video shows the picture and the
  timeline with Media and Edit as sheets, Export beside them, and a timeline bar of just undo,
  split, duplicate, delete and zoom. Autora Photo shows the picture alone with one bar (Undo,
  Redo, Tools, Brush, Layers, Fit) and a sheet for each. Pages, Sheets and Slides keep the page and one
  bar (undo, bold, italic, size, and a list, a row or a slide), with the full ribbon behind More; the
  "Autora" button in their ribbon is gone on every screen. The app window, the browser and Music lose
  their desktop-only buttons. Every tool window now shares one set of measurements on a phone
  (a 48px bar, 40px soft-square buttons, no text pills or round buttons mixed in), 3D and the
  editors follow them, and full screen keeps a strip at the bottom so the chat button no longer
  covers a tool's own buttons. A desktop gets the full editors exactly as before.
