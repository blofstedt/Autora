releaseNotes: >-
  Three things that were wrong.

  The Mind no longer lights up when the sidebar opens. It was meant to glow
  once, when something actually landed in it, and the flag that lit it was
  never cleared -- so every fresh look at the sidebar replayed an ending that
  had finished days ago. It now lights up when something lands, and stops.

  The pill that says the agent is using the browser is centred, and its Stop
  button sits inside the card instead of hanging off the edge. Its entrance
  animation was writing the same property that was holding it in the middle,
  so the centring was thrown away the moment the pill appeared. The centring
  no longer depends on the animation.

  This month has stopped falling as the ledger turns over. The ledger keeps
  the last five thousand calls; what fell off the end was folded into running
  totals with no dates in them, which only the lifetime figure could use, so
  "this month" and "today" quietly dropped that spend and read low against the
  vendor's own bill. What ages out is now kept by day as well, and counted
  back into the day it happened on.

  The note under the figures also says plainly what the number still cannot
  see: usage from outside this app, a vendor's own discounts, and a call that
  ends before it reports its tokens -- an answer you stopped, or an attempt
  that was retried after a dropped connection. Those are charged, and they are
  exactly where this figure comes out under the vendor's.
