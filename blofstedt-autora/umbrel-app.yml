releaseNotes: >-
  The agent works from a board you can watch. Ask for something that takes more
  than one step and it writes the plan as cards in the conversation before it
  starts -- To Do, Doing, Done -- then moves each card itself as the work goes:
  to Doing when it begins a step, to Done when the step is finished. Nothing
  has to be opened: the board appears in the thread where the plan was made.

  The size of the plan follows the job. A coding task may be a dozen cards; an
  errand is a few. "Check my email and draft a reply to the invoice one" is
  read the inbox, pull the attachment, draft the reply, show it for review,
  send it -- and each of those moves across the board as it happens. A card
  that finishes with something to say gets a note on it, so the board carries
  the outcome and not only the columns. A one-line answer still gets no board.

  You can work the board too: drag a card to another column, add one of your
  own, or press Run Next Autonomously to set the agent going on what is next.
  Whatever you move and whatever it moves are the same board -- both sides
  write the whole of it, so neither can quietly undo the other.

  The board was built and never joined up until now: the cell, the drag and
  drop, the columns and the styles were all in the app, and nothing ever wrote
  a card, so no board had ever appeared. Put a plan on it and it does.

  The rest of 0.9.99 stands, unchanged: the camera is on the live bar, and the
  microphone opens once for the whole conversation instead of re-arming -- and
  beeping -- on every phrase.
