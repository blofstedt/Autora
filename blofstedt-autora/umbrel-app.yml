manifestVersion: 1
id: blofstedt-autora
name: Autora
tagline: An agentic AI harness you can watch in real time
icon: https://raw.githubusercontent.com/blofstedt/Autora/main/blofstedt-autora/icon.svg
category: ai
version: "0.9.7"
port: 8817
description: >-
  Autora is a local AI agent that you can watch while it works. Point it at
  your server (or any directory) and give it a task in plain English — it opens
  a browser, runs terminal commands, edits files, and narrates what it's doing
  in a live web UI optimised for both desktop and mobile.


  Key features:


  • Real-time browser view — watch the cursor move, text appear, and pages load
  exactly as the agent drives them, then click and type in the page yourself
  when it hands over (sign-ins, CAPTCHAs) or once it has finished.


  • Persistent browser auth — sign in once to Gmail, Google Calendar, or any
  site; auth is preserved across restarts in a dedicated profile.


  • Live terminal with colour output, progress bars, and scrollback.


  • File diff viewer showing every edit the agent makes.


  • Real tools, listed in Settings — a shell on this machine, the browser it
  drives, control of another computer over a small relay, and a memory that
  outlives the session. Each can be switched off. Nothing waits for approval:
  every command runs straight away and is shown in the thread as it runs.


  • Voice interface (optional) — Deepgram STT+TTS when DEEPGRAM_API_KEY is set.


  • Bring your own model — OpenAI, Google Gemini, Anthropic Claude, DeepSeek,
  OpenRouter, or any local OpenAI-compatible server (vLLM / Ollama). Pick one
  in Settings and choose its model from a priced list.


  • Billing — what you have spent this month, today and all time, broken down
  by provider and model, counted from the tokens each vendor reports.


  • All sessions are recorded and replayable.


  Setup: after installing, open the app, go to Settings, add an API key for
  whichever provider you want and pick a model. Keys are saved to the app's
  data directory, so they survive updates. Keys can also be set in
  ~/umbrel/app-data/blofstedt-autora/.env instead, one KEY=value per line.
  Without a key every panel still works, but nothing answers: the thread says
  which key is missing rather than improvising a reply.


  Voice from a phone: browsers only open a microphone on a secure page, and an
  http address on your home network is not one. Set AUTORA_TLS=1 in the same
  file and Autora also serves https on port 8818 — open that, click through the
  certificate warning once, and dictation and live chat appear. Note that 8818
  is published directly, so it does not go through Umbrel's login.

