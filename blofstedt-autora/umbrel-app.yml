releaseNotes: >-
  Two things you can now decide in advance: what the agent may do without
  asking, and when it may speak up on its own.

  Standing agreements. An approval card grows a third button beside Deny and
  Run it -- "Always allow this kind" -- which runs this call and records the
  class of work as yours, so the same question is not put again. It is offered
  only where it is safe to offer: a command that cannot be undone is asked
  about every time, whatever has been agreed. Everything you have agreed to is
  listed under Standing agreements in Scheduled tasks, with who agreed it, how
  often it has been used, and a bin to take it back, one at a time or all at
  once. When the guard holds a call and you let it through, the rule it writes
  now says so in the transcript rather than quietly.

  Quiet hours, in Settings under Configuration. Two times on your own clock
  during which the agent keeps its own initiative to itself: the note about a
  job that has finished, work it decided to start, anything unprompted is held
  rather than said. Nothing is lost -- the next thing you say carries it. A
  question you ask at 03:40 is still answered at 03:40, and a schedule you set
  still runs at the time you set it. Choosing the same time for both ends turns
  it off, so it cannot become a mute button by accident.
