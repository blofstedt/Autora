releaseNotes: >-
  Your phone can trust this server now. The browser warning, the
  microphone being unavailable, and "this app cannot be installed" were
  never three problems -- they were one: nothing on your device vouched
  for this server's certificate.


  So Autora runs a small certificate authority of its own, and offers it
  for you to install. Open Settings and there is a Trust this server
  section with a download and instructions for Android and iPhone. Install
  it once per device and the warning stops, dictation and Live work, and
  Add to home screen installs a real app with the Autora icon rather than
  a bookmark.


  Certificates are also issued for whatever address you actually use, at
  the moment your browser asks -- tailnet name, .local, a bare IP,
  anything -- so "the certificate is for the wrong name" cannot happen.


  Install it only on devices you own. A certificate authority you trust
  can vouch for any site to that device, and this one is worth exactly as
  much as the server holding its key. If you would rather not, everything
  works as before: click through the warning and the microphone still
  opens. And if you already have a real certificate in front of Autora,
  none of this appears.
