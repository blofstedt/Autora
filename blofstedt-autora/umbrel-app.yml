releaseNotes: >-
  You can now watch Autora browse.


  The agent drives a real Chromium and streams it back to you as video: name
  an address in a message and the page opens in the conversation, where you
  watch the pointer travel to a link and the click land as it happens. The
  pointer is drawn into the page and the click is then a real mouse event at
  those coordinates, so what you see is what the page received. The agent
  itself reads the page as text -- every interactive element numbered the way
  a screen reader would announce it -- which is what makes it good at
  browsing; the video is for you. Frames are never written to the recording,
  so a long session stays a transcript rather than becoming a video file, and
  the card keeps one frame from each step to scroll back through.


  Browsing keeps its own profile, so signing in to something is something you
  do once. It survives restarts and updates along with your keys.


  Pictures now appear in the conversation. A screenshot you asked for, a chart
  the agent made, or an image it wrote into a sentence is drawn where it
  belongs, at a size you can read and one tap from full screen. Previously
  there was nowhere for an image to be served from, so every one of them was a
  broken image -- that is fixed, along with the element picker, which had
  never done anything and now tells you what you pointed at, down to the file
  and line that rendered it.


  Settings had three cards where a line of text ran through a button. Fixed,
  and there is a new card saying whether browsing is available and what is
  missing if it is not.


  Browsing needs Chromium, which this image now ships.

