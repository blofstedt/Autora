releaseNotes: >-
  Typing into the browser inside Autora is much faster. The live picture of
  the page no longer redraws the whole app ten times a second, so the phone
  stays free to handle your keys. Keys you type are sent on right away
  instead of waiting for the page to settle and be photographed after each
  batch. The step log now gets one "typed text" entry when you pause, not
  one per few letters.


  Tapping a button or link on the page no longer flashes the phone keyboard
  up and back down. The keyboard now only comes up when you tap a field you
  can type into.


  The agent is no longer stopped after 12 rounds of tool calls with a note
  asking you to tell it to carry on. It now keeps working until the task is
  done or you press Stop.


  In place of that limit, Autora now watches for the agent going in circles.
  When it runs the same thing and gets the same result three times, fails at
  the same step three times, or keeps getting back only results it has
  already seen, it is told plainly to try something different or to stop and
  say what is blocking it, and a note appears in the chat. Every 20 rounds it
  is also asked to check its progress against your request. If it repeats
  the same thing eight times anyway, the turn is stopped and the chat says
  why.
