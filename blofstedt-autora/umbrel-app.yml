releaseNotes: >-
  Memory and Skills are now one page in the sidebar, Mind. It sorts
  everything the agent keeps into four buckets (preferences, procedures,
  facts and skills), with a count for each and the connections between them.
  You can edit any record, add new ones, or move them to another bucket.
  On a desktop the memory graph now has its own pane on the right, the full
  height of the window, on every page. On a phone the graph is under Map on
  the Mind page, and the strip above the chat stays as it was.
  Status and Logs have moved into System, which now has three sections:
  Status, Logs and Host.


  New pages. Status shows the whole installation at a glance. Sessions lets
  you search, rename, export and delete sessions, with what each one did
  and cost. Logs shows what the server and agent have been doing -- turns,
  tool calls, errors, failed requests -- with filters and a live tail. MCP
  connects Model Context Protocol servers (a local command or a URL) and
  offers their tools to the agent, with one-click presets. System shows the
  host: uptime, memory, load and where settings live.


  Themes. A Settings menu at the bottom of the sidebar switches between
  Autora Violet, Hermes Teal, Nous Blue, Midnight, Ember, Mono, Cyberpunk
  and Rose, and between four fonts (Inter, System, Rounded, Mono). The
  choice is saved on the server, so it follows you between devices.

