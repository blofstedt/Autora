releaseNotes: >-
  One page instead of tabs: memory sits above the conversation and lights
  up as records are written and read, each prompt carries its own
  collapsible timeline of what the agent did about it, and the stage is
  docked under the thread rather than hidden behind a tab. Sessions now
  name themselves from their first message and are picked from a proper
  list rather than an OS dropdown.
