releaseNotes: >-
  A chat now says how much it may do on its own. The mode is a property of the
  conversation rather than of the install, so one chat can be watched in Plan
  while another runs in Auto, and a pill beside the session name says which.

  Plan changes nothing -- every call that would is put to you first, and the
  agent lays out what it intends and stops there. Ask lets looking be free and
  waits for a yes before anything changes. Auto is what Autora has always
  done, and says nothing in the header: a mark on every chat saying "nothing
  special" is noise, and the one worth noticing is the chat that is not in it.

  Work can now start because something outside said so. A trigger is a URL and
  a secret with a prompt attached, so a CI run, a webhook, a cron on another
  host or a phone shortcut can begin a turn -- same budget, same notification,
  same place in the thread list as a scheduled run.

  The console also stops waiting to be asked about a job it started. When a
  background command finishes and its output was never read, it may open a turn
  in that session by itself and report what happened, under the automation
  budget, inside your quiet hours, and never while you are already working in
  that chat.

  Autora is installable, and now it says so. There is an offer in the app when
  the browser will take one (Chrome, Edge, Android), and the written-out route
  for iOS, where Safari fires nothing and Share -> Add to Home Screen is the
  only way.

  One smaller thing. A message can no longer be cut off by the console
  tidying its own context: a fold waits until the message being written is
  out, and the newest turns are never folded away.
