releaseNotes: >-
  Autora can now run JavaScript in the page it is driving -- a tool called
  browser_eval, and the end of the worst way it used to get stuck.

  Some pages draw their own dialogs in script: the buttons have no number in
  the list of elements, and no label the reader can use. Until now the agent
  could only read the page again and again, and an unchanged page looks like
  progress right up until the twentieth read. browser_eval reaches into the
  page instead: __autora.click(__autora.byText("Save as draft")) clicks a
  button by the words on it, __autora.all("button") lists what is on the page,
  and what the script returns comes back with the page as it is afterwards.
  Clicks are real and are drawn on your screen where they land, so you still
  watch every one of them.

  A read of the same unchanged page is now answered differently the third time
  round: instead of the same page again, it says nothing has changed and names
  the way out -- run JavaScript in the page, press Tab to the primary button,
  or hand the page over to you. The fourth identical screenshot is not taken at
  all, for the same reason.

  Also fixed: a one-line script ending in a click could run that click twice --
  once as written and once when it was retried in another shape. A "Discard"
  clicked twice is a post thrown away. The shape of a script is now decided
  before anything runs, and a click happens once.

  A script that fails says what happened in the page's own words instead of
  four hundred characters of Playwright's stack trace, and a click that finds
  nothing says so rather than clicking the wrong element.
