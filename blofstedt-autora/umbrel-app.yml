releaseNotes: >-
  The task board is three columns side by side at last. Before, each column sat
  under the last one on a narrow screen and the board read as a list; now To Do,
  Doing and Done stand left to right at every width, and past the point where
  three columns stop being readable the board scrolls sideways rather than
  folding back into a stack.

  A card is now one line: the work item cut off with an ellipsis, its state at
  the end of the line, and a thin progress bar under it. Tap any card and the
  whole thing opens -- the full title, everything written on it, its steps with
  the finished ones marked and struck through, and the moves that column offers
  -- so nothing has to be crammed into the card itself.

  When a card changes column it is picked up out of the old one and set down in
  the new one, with the same lift-and-place motion the drag already had, so the
  eye can follow where it went instead of finding it gone. A card with no steps
  and no figure no longer shows a made-up 50%: it shows a bar moving steadily
  from left to right, which is what "working, nothing to count yet" looks like,
  and a real figure or a step count replaces it as soon as there is one. The
  board carries its own bar under the header -- cards finished out of cards
  there are.
