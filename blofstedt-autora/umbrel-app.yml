releaseNotes: >-
  A cleaner desktop. The side panel for the live browser is gone: the page
  now sits in the conversation on every screen size, where you click and type
  in it directly, and the conversation itself is wider. The sessions list,
  header, memory bar and conversation now share one surface instead of three
  different shades.


  The message box has been redesigned: one rounded box that grows as you
  write, voice controls on the left, a round Send button that lights up when
  there is something to send, and Stop beside it while the agent works.


  The full memory graph now looks like the memory bar above the chat -- the
  same violet field, glowing nodes and purple links -- and marks the memories
  this session has recalled or written, with the latest one pulsing.


  Earlier in this series: the live browser is used directly (no take-control
  toolbar), the agent asks questions and hands over sign-ins with cards,
  replies are formatted, the memory bar folds to one line, and phones no
  longer scroll sideways.

