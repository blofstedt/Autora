releaseNotes: >-
  Stop actually stops now. The button sent its message over the live
  connection only, and that connection quietly drops while a phone is
  asleep -- so after the screen had been off, Stop did nothing and said
  nothing, and the agent kept going. It now also asks the server directly,
  and tells you if there was nothing running to stop.


  Microphone problems are visible instead of silent. Anything that went
  wrong with dictation was reported through a tooltip, which a phone has
  no way to show, so a microphone that failed looked exactly like one that
  was never built. Failures are now written where you are already looking.


  Worth knowing if voice is not working for you: a browser will not open a
  microphone on a page whose certificate it does not trust. Clicking
  through the warning gets you the page but not the microphone -- so
  dictation, live chat and installing to the home screen all need the
  certificate from Settings to be installed on the device first. That is
  one requirement, not three separate problems.
