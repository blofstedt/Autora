gallery: []
releaseNotes: >-
  Fixes the app failing to start after a Deepgram key was saved. The key
  switched on voice, which crashed before the server began listening, so
  the web UI refused connections — and only on the next restart, long
  after the key was entered. Voice now needs AUTORA_VOICE set explicitly,
  and can never stop the app from starting.
