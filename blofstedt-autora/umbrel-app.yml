releaseNotes: >-
  A photo you are about to send is shown as the photo.

  Attachments under the message box were one flat pill whether you had picked
  a picture or a document: the name and its size with a small icon beside them.
  A picture is now the picture itself, in a square box at the size of the row,
  and a document is a box with its name and size in it. Both carry the same
  small x to take them off the message, and while an upload is running the row
  shows one more of those boxes turning instead of the word uploading. On a
  narrow screen the boxes are smaller so more than one still fits on a line.

  A photo taken with the phone no longer sits between two black bars.

  A portrait stream from the camera was being stretched to the width of its
  frame, which letterboxed it -- a solid black column down each side of the
  picture in the viewer and in the round camera button. The picture is now
  given only the room it needs, so the bars are gone and the shot fills its box.
