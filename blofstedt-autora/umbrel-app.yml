releaseNotes: >-
  Autora knows which model is answering you.


  Ask which provider is running and you now get the right answer, because
  every turn carries it: the provider and model you picked in Settings are
  stated up front. Nothing said so before, so the model answered from
  whatever the conversation contained -- and what it often contained was the
  notice this console writes when no model is connected yet.


  That notice went into the transcript looking exactly like something the
  model had written. So once you added a key, the model read it back as its
  own earlier words and stayed consistent with them: explaining in confident
  detail that it was running on local fallbacks only, while visibly streaming
  from the provider you had just configured. The console's own text is now
  marked as the console's. You still see it in the conversation, where it is
  true at the moment it is written, but it is no longer replayed to the model
  as something the model said.


  Two questions in a row also used to run together into one sentence on their
  way to the model. They now arrive as two.

