releaseNotes: >-
  Settings you add by hand to autora.env are no longer deleted when you
  press Save in the settings panel.


  The file says at the top that it is safe to edit by hand. It was not:
  the editor rebuilt it from the handful of names it knows about, so
  anything else you had put there vanished the next time you saved a key
  or changed a model -- silently, with nothing to notice. Whatever that
  setting switched on simply stopped happening.


  This is what turned the https listener off. AUTORA_TLS=1 was added by
  hand, a later Save removed it, and the secure page went from working to
  refusing connections. That looks exactly like a certificate being
  rejected, and was chased as one for a long time.


  The editor now keeps every line it does not recognise, under a comment
  saying so.
