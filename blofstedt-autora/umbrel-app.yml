releaseNotes: >-
  The voice can be turned off from the conversation, and it stays off. Ask for
  it to stop talking -- or say the voice is getting annoying -- and the agent
  mutes itself where it stands: whatever was being said stops mid-sentence, and
  the speak tool is taken away from every turn after that, so it answers in
  writing and does not reach for the voice again. Settings -> Model & tools ->
  Voice carries the switch, on by default, and it is the same setting either
  way round: nothing is said on the page while it is off, and turning it back
  on is how the voice comes back.

  It is a switch and not a volume: replies read out in talk mode are your own
  listening, and are not touched by it.

  On a phone the switch at the top of the chat -- auto, ask, off -- opens its
  menu inside the window. It used to hang from the pill by its left edge, which
  is fine in a wide window and off the side of the screen in a narrow one,
  where the options were simply not there to press. The menu is now measured
  against the window it is in and shifted back inside it, however narrow.

  The dots in the chat list mean one thing now: green is a chat the agent is
  working in at this moment, grey is every other. The dot used to be green for
  every chat ever made, because a chat was marked open when it was created and
  nothing ever cleared it, so the colour said nothing. Working is asked of the
  turn that is running, and a chat nobody is working in is grey however
  recently it was used.

  The rest of 0.9.97 stands, unchanged: the name that wakes it is heard the way
  it is actually said, the live bar says when the microphone did not open and
  opens it on a tap, triggers have a page of their own, the bar over the
  message box counts money in the three spans it is asked in, and a menu opened
  in the header stays over the chat.
