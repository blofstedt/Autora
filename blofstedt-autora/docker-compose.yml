version: "3.7"

services:
  # Umbrel's reverse proxy. APP_HOST follows <app-id>_<service-name>_1.
  app_proxy:
    environment:
      APP_HOST: blofstedt-autora_app_1
      APP_PORT: 8817

  app:
    image: ghcr.io/blofstedt/autora:latest
    restart: on-failure
    # The https listener, published directly rather than through app_proxy,
    # because the proxy speaks http to the backend and the browser needs the
    # certificate to be the one it is talking to. Nothing listens here unless
    # AUTORA_TLS is set to 1 below -- and note that a port published this way
    # skips Umbrel's login, so turn it on when you want the microphone on a
    # phone and leave it off otherwise.
    ports:
      - "8818:8818"
    volumes:
      # The only directory that survives an update: memories, session
      # recordings, the browser profile and the settings file all live here.
      # AUTORA_HOME is pointed at it by the entrypoint.
      - "${APP_DATA_DIR}/data:/data"
      # Full read-write access to the host filesystem so the agent can work
      # anywhere on the server, not just inside the container.
      - "/:/host:rw"
    environment:
      # Network
      AUTORA_HOST: "0.0.0.0"
      AUTORA_PORT: "8817"
      # Dictation and live voice chat need a secure page -- browsers will not
      # open a microphone for http://<ip>, whatever the site settings say. Set
      # this to 1 and Autora also serves https on 8818 with a self-signed
      # certificate: click through the warning once per device and the
      # microphone appears. http on 8817 is unaffected either way.
      AUTORA_TLS: "0"
      # Agent defaults — full server access, no per-action prompts
      AUTORA_WORKDIR: "/host"
      AUTORA_AUTO_APPROVE: "1"
      AUTORA_BROWSER_PROFILE: "/data/browser-profile"
      # API keys — set these in ~/umbrel/app-data/blofstedt-autora/.env
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
      ASSEMBLYAI_API_KEY: "${ASSEMBLYAI_API_KEY:-}"
