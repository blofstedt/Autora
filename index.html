<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch and home
         indicator, which the safe-area insets in the CSS then pad back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The header's brand mark. Repainted at runtime (src/lib/chrome.ts) so the
         tab carries session state: violet working, green live, amber waiting on you. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E %3Cdefs%3E %3ClinearGradient id='s' x1='0' y1='0' x2='1' y2='1'%3E %3Cstop offset='0' stop-color='%238b7bff'/%3E %3Cstop offset='1' stop-color='%2322d3ee'/%3E %3C/linearGradient%3E %3CradialGradient id='w'%3E %3Cstop offset='0' stop-color='%23a855f7' stop-opacity='0.75'/%3E %3Cstop offset='1' stop-color='%236e5bff' stop-opacity='0'/%3E %3C/radialGradient%3E %3Cfilter id='g' x='-50%' y='-50%' width='200%' height='200%'%3E %3CfeGaussianBlur stdDeviation='0.9' result='b'/%3E %3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E %3C/filter%3E %3C/defs%3E %3Crect width='32' height='32' rx='7' fill='%230b0a14'/%3E %3Ccircle cx='16' cy='16' r='11.00' fill='url(%23w)'/%3E %3Cpath d='M16.00 4.75L18.30 13.70L27.25 16.00L18.30 18.30L16.00 27.25L13.70 18.30L4.75 16.00L13.70 13.70Z' fill='url(%23s)' filter='url(%23g)'/%3E %3C/svg%3E" />
    <meta name="theme-color" content="#08090d" />

    <!-- Installable to a phone's home screen: manifest for Android/Chrome,
         the apple-* pair for iOS, which ignores the manifest's display mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Autora" />

    <!-- Stamped by the server as it hands this page out (see server.py's
         index route). The page can then compare what it was built as against
         what the server reports now, and say so when they differ -- which is
         the difference between "my update did not arrive" and "this tab is an
         old copy", two things that look identical from the sofa. -->
    <meta name="autora-version" content="dev" />

    <meta name="description" content="Autonomous AI agent console and live execution workspace" />
    <meta property="og:title" content="Autora" />
    <meta property="og:description" content="Autonomous AI agent console and live execution workspace" />

    <title>Autora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
