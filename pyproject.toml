[project]
name = "autora"
version = "0.1.0"
description = "An agentic harness you can watch: live browser, terminal and desktop, recorded for replay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
local = ["openai>=1.40"]
browser = ["playwright>=1.44"]
voice = ["numpy>=1.26", "sounddevice>=0.4"]
all = [
    "anthropic>=0.40", "openai>=1.40", "playwright>=1.44",
    "numpy>=1.26", "sounddevice>=0.4",
]

[project.scripts]
autora = "autora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autora"]

[tool.ruff]
line-length = 100
target-version = "py311"
