[project]
name = "autora"
version = "0.1.0"
description = "An agentic harness you can watch: live browser, terminal and desktop, recorded for replay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
local = ["openai>=1.40"]
browser = ["playwright>=1.44"]
voice = ["numpy>=1.26", "sounddevice>=0.4"]
voice-kokoro = ["numpy>=1.26", "sounddevice>=0.4", "kokoro-onnx>=0.3"]
voice-piper = ["numpy>=1.26", "sounddevice>=0.4", "piper-tts>=1.2"]
voice-stt-local = ["numpy>=1.26", "sounddevice>=0.4", "faster-whisper>=1.0"]
voice-stt-api = ["numpy>=1.26", "sounddevice>=0.4", "openai>=1.40"]
voice-deepgram = ["numpy>=1.26", "sounddevice>=0.4", "deepgram-sdk>=3.4"]  # covers both STT and TTS
voice-assemblyai = ["numpy>=1.26", "sounddevice>=0.4", "assemblyai>=0.24"]
# Dependencies for the desktop relay (install on the machine to be controlled,
# not necessarily on the Autora server itself):
relay = ["websockets>=10", "mss>=9", "pyautogui>=0.9", "pillow>=10"]
# For `autora up --tls`, which serves https so a browser will allow the
# microphone. Optional: the openssl binary does the same job where it exists.
tls = ["cryptography>=42"]
all = [
    "anthropic>=0.40", "openai>=1.40", "playwright>=1.44",
    "numpy>=1.26", "sounddevice>=0.4",
    "kokoro-onnx>=0.3", "piper-tts>=1.2", "faster-whisper>=1.0",
    "cryptography>=42",
]

[project.scripts]
autora = "autora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autora"]

[tool.ruff]
line-length = 100
target-version = "py311"
