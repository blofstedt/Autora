<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="6" y1="6" x2="26" y2="26">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <radialGradient id="bedglow" cx="50%" cy="72%" r="62%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="32" height="32" rx="7.5"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#0d1117"/>
    <rect width="32" height="32" fill="url(#bedglow)"/>
    <!-- The printer: two uprights, a gantry across the top, a base beam. -->
    <g fill="url(#frame)">
      <rect x="4.6" y="6.2" width="2.8" height="19.6" rx="1"/>
      <rect x="24.6" y="6.2" width="2.8" height="19.6" rx="1"/>
      <rect x="4.6" y="6.2" width="22.8" height="2.8" rx="1"/>
      <rect x="4.6" y="23" width="22.8" height="2.8" rx="1"/>
      <!-- The tool head riding the gantry. -->
      <rect x="12.2" y="11.2" width="7.6" height="2.8" rx="1"/>
    </g>
    <!-- Its nozzle, pointing at the work. -->
    <polygon points="14.6,13.9 17.4,13.9 16,17.9" fill="url(#frame)"/>
    <!-- The part, laid down a layer at a time on the bed: the layers nearly
         touch, so at 16 px they read as one solid print and at 128 px as
         three passes of the nozzle. -->
    <g fill="#e6fbb0">
      <rect x="12.2" y="21.65" width="7.6" height="1.15" rx="0.3"/>
      <rect x="12.55" y="20.35" width="6.9" height="1.15" rx="0.3"/>
      <rect x="12.9" y="19.05" width="6.2" height="1.15" rx="0.3"/>
    </g>
  </g>
</svg>
