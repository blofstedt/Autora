<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch and home
         indicator, which the safe-area insets in the CSS then pad back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The header's brand mark. Repainted at runtime (src/lib/chrome.ts) so the
         tab carries session state: violet working, green live, amber waiting on you. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236e5bff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='28' height='28' rx='9.5' fill='url(%23a)'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%2308090d'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%2398a1b6'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#08090d" />

    <!-- Installable to a phone's home screen: manifest for Android/Chrome,
         the apple-* pair for iOS, which ignores the manifest's display mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Autora" />

    <title>Autora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
