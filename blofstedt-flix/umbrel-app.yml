gallery: []
releaseNotes: >-
  What's new since 0.3.2. The Torrents page now shows a 12-month storage graph
  and, for every download, who is holding it and when the hold lapses, so you
  can see what is taking up space and why. The player fills the screen with a
  pinch and shows the actors' photos. Flix downloads ahead for you and stands
  down when the disk is getting full, and downloads can be kept in sync with a
  Downloads folder on the host. An episode counts as watched at 100% instead of
  a moment early. Installing Flix from the browser works again: the app no
  longer swallows Chrome's install prompt, so "Add to home screen" is offered
  and Flix opens like an app instead of a browser tab.
