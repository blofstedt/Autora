gallery: []
releaseNotes: >-
  A new Flix logo, and no more blank page when the server is unreachable: if
  Flix cannot reach its own API, the app now says so instead of showing an
  empty screen.


  API keys can now be set from inside Flix, no .env file and no restart. An
  admin gets a Settings page in the app with the BTN API key, the optional
  TMDB key and the qBittorrent connection on it, each with a Test connection
  button that says whether it worked — connecting as your BTN username, seeing
  TMDB accept the key, or reading qBittorrent's version. A saved key can be
  removed again and the app falls back to whatever the environment holds, and
  the page says which of the two each setting came from.


  BTN's IP check is explained too: if BTN will not answer because this
  server's address is not on your approved list, Flix now says so and points
  at your BTN notices instead of failing with a vague error.
