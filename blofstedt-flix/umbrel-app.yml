gallery: []
releaseNotes: >-
  Cast to a TV. When a Chromecast or Google TV is on the home network, the
  player has a Cast button: pick the TV and the episode you are watching starts
  there at the same moment, while the phone pauses. The TV fetches the video
  from this box over the home network, which is what LAN_URL is for; it is set
  to this box here. If your router ever gives the box a new address, set
  LAN_URL to match or the Cast button will not appear.
